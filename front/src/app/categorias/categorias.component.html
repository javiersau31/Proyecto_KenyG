<div class="max-w-6xl mx-auto p-6">

  <h1 class="text-3xl font-bold text-blue-900 mb-8">
    Gestión de Categorías
  </h1>

  <!-- TABLA -->

  <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">

    <table class="min-w-full">

      <thead class="bg-blue-600 text-white">

        <tr>
          <th class="px-6 py-4 text-left">
            Nombre
          </th>

          <th class="px-6 py-4 text-left">
            Descripción
          </th>

          <th class="px-6 py-4 text-center">
            Acciones
          </th>
        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let categoria of categorias"
          class="border-b hover:bg-blue-50 transition"
        >

          <td class="px-6 py-4 font-medium">
            {{ categoria.nombre }}
          </td>

          <td class="px-6 py-4 text-gray-600">
            {{ categoria.descripcion }}
          </td>

          <td class="px-6 py-4">

            <div class="flex justify-center gap-4">

              <!-- EDITAR -->

              <button
                class="text-blue-600 hover:text-blue-800 font-semibold"
                (click)="activarEdicion(categoria)"
              >
                ✏️ Editar
              </button>

              <!-- ELIMINAR -->

              <ng-container
                *ngIf="
                  categoriaAEliminar === categoria.id_categoria;
                  else botonEliminar
                "
              >

                <button
                  class="text-red-600 font-semibold"
                  (click)="eliminarCategoriaConfirmada()"
                >
                  Sí
                </button>

                <button
                  class="text-gray-500 font-semibold"
                  (click)="cancelarEliminacion()"
                >
                  No
                </button>

              </ng-container>

              <ng-template #botonEliminar>

                <button
                  class="text-red-600 hover:text-red-800 font-semibold"
                  (click)="confirmarEliminacion(categoria.id_categoria)"
                >
                  🗑️ Eliminar
                </button>

              </ng-template>

            </div>

          </td>

        </tr>

        <!-- SIN CATEGORÍAS -->

        <tr *ngIf="categorias.length === 0">

          <td
            colspan="3"
            class="text-center py-10 text-gray-500"
          >
            No hay categorías registradas.
          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- CREAR CATEGORÍA -->

  <div class="bg-white rounded-xl shadow-lg p-6">

    <h2 class="text-xl font-semibold text-gray-700 mb-5">
      Nueva categoría
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <input
        type="text"
        [(ngModel)]="nuevaCategoria.nombre"
        placeholder="Nombre de la categoría"
        class="border border-gray-300 rounded-lg px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input
        type="text"
        [(ngModel)]="nuevaCategoria.descripcion"
        placeholder="Descripción"
        class="border border-gray-300 rounded-lg px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

    </div>

    <div class="flex justify-end mt-5">

      <button
        class="bg-green-600 hover:bg-green-700
               text-white font-semibold
               px-6 py-3 rounded-lg transition"
        (click)="agregarCategoria()"
      >
        + Crear categoría
      </button>

    </div>

  </div>

</div>


<!-- MODAL EDITAR -->

<div
  *ngIf="categoriaEditando"
  class="fixed inset-0 bg-black/50
         flex items-center justify-center
         z-50 p-4"
>

  <div
    class="bg-white rounded-2xl shadow-2xl
           w-full max-w-lg p-6"
  >

    <h2 class="text-2xl font-bold text-blue-900 mb-6">
      Editar categoría
    </h2>

    <div class="space-y-4">

      <input
        type="text"
        [(ngModel)]="categoriaEditando.nombre"
        placeholder="Nombre"
        class="w-full border border-gray-300
               rounded-lg px-4 py-3
               focus:outline-none focus:ring-2
               focus:ring-blue-500"
      />

      <textarea
        [(ngModel)]="categoriaEditando.descripcion"
        placeholder="Descripción"
        rows="4"
        class="w-full border border-gray-300
               rounded-lg px-4 py-3
               focus:outline-none focus:ring-2
               focus:ring-blue-500"
      ></textarea>

    </div>

    <div class="flex justify-end gap-3 mt-6">

      <button
        class="px-5 py-2 rounded-lg
               bg-gray-200 hover:bg-gray-300"
        (click)="cancelarEdicion()"
      >
        Cancelar
      </button>

      <button
        class="px-5 py-2 rounded-lg
               bg-blue-600 hover:bg-blue-700
               text-white font-semibold"
        (click)="guardarEdicion()"
      >
        Guardar cambios
      </button>

    </div>

  </div>

</div>
